<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Panel · TAZ a TAZ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:wght@700&display=swap">
<style>
:root{--bg:#EEF3F8;--card:#fff;--ink:#1B2A4A;--muted:#5F7090;--line:#CBD8E6;--acc:#1F3158;--red:#C0182F;--ok:#1F7A4D;--warn:#9A6400;--okbg:#E3F5EA;--kobg:#FDE8EA;--hibg:#FFF4D6;--sel:#E2ECF8}
@media (prefers-color-scheme:dark){:root{--bg:#0E1626;--card:#16223A;--ink:#E8EFFA;--muted:#9DB0CC;--line:#2C4062;--acc:#9CC0F0;--red:#FF7A8A;--ok:#58C98E;--warn:#E5B25D;--okbg:#12352A;--kobg:#3A1820;--hibg:#3A3115;--sel:#1F3150;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "DM Sans",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
header h1{font:700 1.15rem Fraunces,Georgia,serif;margin:0}
header .st{color:var(--muted);font-size:.9rem;flex:1;min-width:160px}
header .st.dirty{color:var(--warn);font-weight:700}
.b{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 13px}
.b:hover{border-color:var(--muted)}
.b.p{background:var(--acc);border-color:var(--acc);color:var(--card);font-weight:700}
.b.d{color:var(--red)}
.b.s{padding:4px 9px;font-size:.85rem}
.b:disabled{opacity:.5;cursor:default}
.layout{display:grid;grid-template-columns:280px minmax(0,1fr) 410px;gap:14px;padding:14px;align-items:start}
.pane{background:var(--card);border:1px solid var(--line);border-radius:14px}
nav.pane{position:sticky;top:64px;max-height:calc(100vh - 78px);overflow:auto;padding:10px}
.blk{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.blk select{flex:1;padding:7px;border:1px solid var(--line);border-radius:9px;background:var(--card)}
.nl{list-style:none;margin:0;padding:0}
.nl .th{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:12px 4px 4px}
.nl button{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:6px 8px}
.nl button:hover{background:var(--bg)}
.nl button.on{background:var(--sel);font-weight:700}
.nl i{font-style:normal;width:1.2em;text-align:center;color:var(--muted)}
.nl .err{color:var(--red);margin-left:auto}
.adds{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.side-links{display:flex;flex-direction:column;gap:2px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
main.pane{padding:18px 20px 40px;min-height:60vh}
main h2{font:700 1.3rem Fraunces,Georgia,serif;margin:0 0 4px}
.kind{color:var(--muted);font-size:.85rem;margin:0 0 14px}
.tb{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.f{display:block;margin:0 0 14px}
.f>span{display:block;font-weight:700;font-size:.88rem;margin-bottom:4px}
.f small{display:block;color:var(--muted);font-weight:400;margin-top:3px}
.f input:not([type=checkbox]),.f textarea,.f select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
.f textarea{resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13.5px;line-height:1.5}
.f input:focus,.f textarea:focus,.f select:focus{outline:2px solid var(--acc);outline-offset:0}
.chk{display:flex;gap:8px;align-items:center;margin:0 0 14px}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>.f{flex:1;min-width:140px}
.tools{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 5px}
.tools button{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:2px 8px;font-size:.8rem}
.chips{display:flex;flex-direction:column;gap:6px;margin:0 0 8px}
.chip{display:flex;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:6px 10px}
.chip span{flex:1}.chip code{color:var(--muted);font-size:.8rem}
.card{border:1px solid var(--line);border-radius:12px;margin:0 0 10px;background:var(--card)}
.card>.hd{display:flex;gap:8px;align-items:center;padding:10px 12px;cursor:pointer}
.card>.hd b{white-space:nowrap}.card>.hd span{flex:1;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card>.bd{padding:4px 14px 14px;border-top:1px solid var(--line)}
.ok{color:var(--ok)}.ko{color:var(--red)}
.msg{border-radius:10px;padding:9px 12px;margin:0 0 12px;font-size:.9rem}
.msg.ok{background:var(--okbg)}.msg.ko{background:var(--kobg);color:var(--red)}.msg.hi{background:var(--hibg);color:var(--ink)}
.vars{display:flex;flex-direction:column;gap:6px;margin:0 0 6px}
.var{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.f .var input:not([type=checkbox]){padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.f .var input.nm{width:4.5em}.f .var input.num{width:4.2em}.f .var input.fx{width:auto;flex:1;min-width:140px}
.var label{display:flex;gap:4px;align-items:center;font-weight:400}
.grid-m{display:inline-grid;gap:6px;margin:4px 0 10px}.grid-m input{width:7em;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
details.help{margin:0 0 16px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--bg)}
details.help summary{cursor:pointer;font-weight:700}
details.help code{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:0 4px}
details.help table{border-collapse:collapse;margin:6px 0}details.help td{padding:2px 10px 2px 0;vertical-align:top}
aside.pane{position:sticky;top:64px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px}
aside .phone{width:390px;height:calc(100vh - 130px);max-height:820px;border:1px solid var(--line);border-radius:22px;overflow:hidden;background:#F6FAFD}
aside iframe{width:100%;height:100%;border:0}
aside small{color:var(--muted)}
.banner{margin:14px 14px 0;padding:10px 14px;border-radius:12px;background:var(--hibg);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner span{flex:1}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);max-width:560px;width:calc(100% - 32px);padding:18px 20px}
dialog::backdrop{background:rgba(10,20,40,.45)}
dialog ul{padding-left:20px}dialog li{margin:0 0 6px}
.toggle-prev{display:none}
@media (max-width:1180px){.layout{grid-template-columns:250px minmax(0,1fr)}aside.pane{display:none}aside.pane.show{display:flex;position:fixed;inset:64px 10px 10px auto;z-index:6;box-shadow:0 10px 40px rgba(0,0,0,.3)}.toggle-prev{display:inline-block}}
@media (max-width:760px){.layout{grid-template-columns:1fr}nav.pane{position:static;max-height:none}aside.pane.show{inset:64px 0 0 0;border-radius:0}aside .phone{width:100%;height:calc(100vh - 120px)}}
</style>
</head>
<body>
<header>
 <h1>Panel · <span id="marca">TAZ a TAZ</span></h1>
 <span class="st" id="st">Cargando…</span>
 <button class="b toggle-prev" data-a="prev">Vista previa</button>
 <a class="b" href="index.html" target="_blank" rel="noopener" style="text-decoration:none">Abrir la web</a>
 <button class="b" data-a="descargar">Descargar copia</button>
 <button class="b p" data-a="guardar" id="bguardar">Guardar</button>
</header>
<div id="banner"></div>
<div class="layout">
 <nav class="pane" id="nav"></nav>
 <main class="pane" id="form"></main>
 <aside class="pane" id="prev"><div class="phone"><iframe id="frame" src="index.html#preview" title="Vista previa"></iframe></div><small>Vista previa: así lo verán los alumnos (no guarda progreso)</small></aside>
</div>
<dialog id="dlg"></dialog>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/13.2.0/math.min.js"></script>
<script src="js/generadores.js"></script>
<script src="js/motor.js"></script>
<script src="js/editor.js"></script>
</body>
</html>
