<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TAZ a TAZ · Matemáticas II</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:wght@600;700&family=Caveat:wght@600&family=Noto+Sans+Math&display=swap">
<style>
:root{--paper:#F6FAFD;--grid:#D9E7F3;--ink:#1B2A4A;--muted:#566784;--red:#C0182F;--ok:#1F7A4D;--card:#FFFFFF;--line:#BFD2E6;--teo:#2563A8;--eje:#C0182F;--rep:#B7791F;--pru:#6B3FA0;--okbg:#E3F5EA;--kobg:#FDE8EA;--hibg:#FFF4D6;--sh:0 1px 2px rgba(27,42,74,.08),0 10px 24px -14px rgba(27,42,74,.35);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#10192B;--grid:#1B2A44;--ink:#E8EFFA;--muted:#9DB0CC;--red:#FF7A8A;--ok:#58C98E;--card:#16223A;--line:#2C4062;--teo:#6CA6E8;--eje:#FF7A8A;--rep:#E5B25D;--pru:#B794F4;--okbg:#12352A;--kobg:#3A1820;--hibg:#3A3115;--sh:0 10px 24px -14px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--paper:#10192B;--grid:#1B2A44;--ink:#E8EFFA;--muted:#9DB0CC;--red:#FF7A8A;--ok:#58C98E;--card:#16223A;--line:#2C4062;--teo:#6CA6E8;--eje:#FF7A8A;--rep:#E5B25D;--pru:#B794F4;--okbg:#12352A;--kobg:#3A1820;--hibg:#3A3115;--sh:0 10px 24px -14px rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px;color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;font-size:17px;line-height:1.55}
main{max-width:720px;margin:0 auto;padding:28px 18px 56px}
h1,h2,h3,.big{font-family:Fraunces,Georgia,serif;font-weight:700;letter-spacing:-.015em}
h1{font-size:clamp(2.4rem,7vw,3.6rem);line-height:1.02;margin:6px 0 12px}
h2{font-size:clamp(1.7rem,5vw,2.2rem);line-height:1.1;margin:10px 0 14px}
h3{font-size:1.2rem;margin:0 0 8px}
.lead{max-width:52ch;color:var(--muted);margin:0 0 26px}
.brand{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--red);font-weight:700;margin:0}
button{font:inherit;font-weight:500;cursor:pointer;color:inherit}
button:disabled{cursor:not-allowed}
.btn{background:var(--ink);color:var(--paper);border:0;border-radius:12px;padding:12px 24px;font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.28)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.ghost{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 18px}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.back{background:none;border:0;color:var(--muted);padding:0;font-size:.95rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.card{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--sh);transition:transform .15s}
.card:hover{transform:translateY(-2px)}
.card b{font-family:Fraunces,Georgia,serif;font-size:1.45rem}.card span{color:var(--muted);font-size:.95rem}.card em{font-style:normal;font-size:.88rem;font-weight:700;color:var(--ok)}
.bar{display:block;height:10px;background:var(--grid);border-radius:5px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--ok);border-radius:5px;transition:width .5s}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin:12px 0 22px}
.tabs button{flex:1;background:transparent;border:0;color:var(--muted);border-radius:10px;padding:9px 6px}
.tabs .on{background:var(--ink);color:var(--paper);font-weight:700}
.chip{font-style:normal;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:2px 8px;border-radius:6px;margin-right:8px;border:1.5px solid currentColor;white-space:nowrap}
.chip.teoria{color:var(--teo)}.chip.ejercicio{color:var(--eje)}.chip.repaso{color:var(--rep)}.chip.prueba{color:var(--pru)}
.box{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--teo);border-radius:14px;padding:18px 22px;margin:0 0 14px;box-shadow:var(--sh)}
.box p{margin:0 0 8px}.box p:last-child{margin:0}
.box.rv{border-left-color:var(--ok)}.box.rv.ko{border-left-color:var(--red)}
/* Teoría: una hoja continua */
.doc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 20px 24px;box-shadow:var(--sh)}
.doc .tm{font-size:1.45rem;margin:30px 0 4px;padding-top:22px;border-top:2px solid var(--ink)}
.doc .tm:first-child{margin-top:12px;padding-top:0;border-top:0}
.doc h3{font-size:1.1rem;margin:22px 0 6px;color:var(--teo)}
.doc p{margin:0 0 10px}
.doc ul{margin:0 0 10px;padding-left:22px}.doc li{margin:0 0 4px}
.doc .soon{color:var(--muted)}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.toc button{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.85rem;color:var(--muted)}
@media (max-width:520px){.doc{margin:0 -8px;padding:2px 14px 20px;border-radius:12px}}
.top{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.x{background:none;border:0;color:var(--muted);font-size:1.5rem;padding:4px 8px;line-height:1}
.seg{flex:1;display:flex;gap:5px}.seg i{flex:1;height:12px;border-radius:6px;background:var(--grid);transition:background .3s}
.seg i.c{background:var(--ink)}.seg i.ok{background:var(--ok)}.seg i.ko{background:var(--red)}.seg i.a{background:var(--muted)}
.kind{margin:0 0 12px;font-weight:700}
.qc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:var(--sh)}
@media (max-width:520px){.qc{padding:18px 16px}}
.meta{margin:0 0 6px;color:var(--muted);font-size:.88rem}
.q{margin:0 0 18px;font-size:1.2rem;font-weight:500;line-height:1.5}
input{font:inherit;padding:11px 14px;border:2px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);width:210px;max-width:100%}
.opts{display:flex;flex-direction:column;gap:8px}.opts label{display:flex;gap:12px;align-items:center;padding:12px 14px;border:2px solid var(--line);border-radius:12px;cursor:pointer;background:var(--paper)}
.opts label:has(input:checked){border-color:var(--ink)}.opts input{width:auto;accent-color:var(--ink)}
.ord .row{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}.ord ol{margin:8px 0;padding-left:24px;color:var(--ink)}
.mx{display:inline-grid;gap:4px 10px;border-left:2px solid currentColor;border-right:2px solid currentColor;padding:2px 8px;vertical-align:middle;text-align:center}
.mi{width:4.6ch;padding:6px;text-align:center}
.ft{position:sticky;bottom:0;margin-top:20px;padding:14px 0;background:linear-gradient(transparent,var(--paper) 16px)}
.acts{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:12px 8px;font-size:.95rem}
.bn{border-radius:12px;padding:12px 16px;margin-bottom:12px}
.bn.ok{background:var(--okbg);color:var(--ok);font-weight:700}.bn.ko{background:var(--kobg);color:var(--red);font-weight:700}.bn.hint,.bn.sol{background:var(--hibg)}
.sol ol{margin:6px 0 0;padding-left:22px}
.res{text-align:center;padding:26px 10px 8px}.big{font-size:3.6rem;line-height:1;margin:0}.res.ok .big{color:var(--ok)}.res.ko .big{color:var(--red)}
.pen{font-family:Caveat,"Segoe Script",cursive;font-size:1.5rem;line-height:1.25;color:var(--red);margin:8px 0}.pen.ok{color:var(--ok)}
.cta{margin-top:44px;padding:24px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh)}
.cta h3{font-size:1.3rem}.cta p{margin:0 0 14px;max-width:52ch}
.cta a{display:inline-block;padding:12px 22px;background:var(--red);color:#fff;text-decoration:none;border-radius:12px;font-weight:700}
.hd{background:#1F3158;color:#F2F6FC;border-radius:20px;padding:20px 22px;margin:12px 0 16px;box-shadow:var(--sh)}
.hd h2{margin:0 0 2px;color:#fff}.hd p{margin:0 0 14px;opacity:.78;font-size:.95rem}
.hd .bar{background:rgba(255,255,255,.18);height:12px;margin:0}.hd .bar i{background:#7EE2A8}
.hd small{display:block;margin-top:8px;opacity:.85}
.mp{list-style:none;margin:6px 0 0;padding:0}
.mp li{display:flex;justify-content:center;padding:12px 0;transform:translateX(var(--x))}
.mp li.tmh{transform:none;padding:26px 0 2px;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted);text-align:center}
.nd{display:flex;flex-direction:column;align-items:center;gap:9px;background:none;border:0;padding:0;max-width:210px;text-align:center;position:relative}
.dot{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font-size:1.7rem;font-weight:700;color:#fff;background:var(--c);box-shadow:0 6px 0 var(--cd),0 14px 18px -10px rgba(0,0,0,.45);transition:transform .12s,box-shadow .12s}
.nd:not(:disabled):active .dot{transform:translateY(4px);box-shadow:0 2px 0 var(--cd)}
.nd.ejercicio{--c:#D6263D;--cd:#9E1527}.nd.repaso{--c:#D9921B;--cd:#A56A0B}.nd.prueba{--c:#7A4BC0;--cd:#56309A}
.nd.dn{--c:#2E9E64;--cd:#1E7348}
.nd.prueba .dot{width:86px;height:86px;font-size:2.2rem}
.nd.lk .dot{background:var(--grid);color:var(--muted);box-shadow:0 6px 0 var(--line)}
.nd.lk .lb,.nd.lk small{opacity:.55}
.lb{font-weight:700;font-size:.95rem;line-height:1.25}.nd small{color:var(--muted)}
.nd.cur{margin-top:34px}.nd.cur .dot{animation:pl 1.8s ease-in-out infinite}
@keyframes pl{50%{box-shadow:0 6px 0 var(--cd),0 0 0 10px color-mix(in srgb,var(--c) 22%,transparent)}}
.go{position:absolute;top:-38px;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:3px 12px;font-weight:700;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;box-shadow:0 3px 0 var(--line);white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
.go::after{content:"";position:absolute;left:50%;bottom:-7px;width:10px;height:10px;background:var(--card);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
@keyframes bob{50%{transform:translateY(-4px)}}
math{font-family:"Noto Sans Math","STIX Two Math","Cambria Math",math,serif;font-size:1.12em}
math[display="block"]{margin:.7em 0;overflow-x:auto;overflow-y:hidden;max-width:100%}
.katex-display{display:block}
.box,.qc,.opts label,.ord button,.doc{overflow-wrap:anywhere}
.qc{position:relative}
.qc.in{animation:slin .3s ease-out}
@keyframes slin{from{opacity:0;transform:translateX(30px)}}
.qc.good{border-color:var(--ok);animation:pop .45s ease-out;box-shadow:0 0 0 5px color-mix(in srgb,var(--ok) 22%,transparent)}
@keyframes pop{40%{transform:scale(1.025)}}
.qc.bad{border-color:var(--red);box-shadow:0 0 0 5px color-mix(in srgb,var(--red) 18%,transparent)}
.qc.shake{animation:shk .42s}
@keyframes shk{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.chk{position:absolute;right:16px;top:12px;width:44px;height:44px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:1.5rem;font-weight:700;animation:chk .5s ease-out both}
@keyframes chk{from{transform:scale(0);opacity:0}60%{transform:scale(1.2)}to{transform:scale(1);opacity:1}}
.opts label{transition:transform .08s,border-color .15s,background .15s}.opts label:active{transform:scale(.98)}
.opts label.ok{border-color:var(--ok)!important;background:var(--okbg)!important}.opts label.ko{border-color:var(--red)!important;background:var(--kobg)!important}
.opts.dis label{pointer-events:none}
@media (prefers-reduced-motion:reduce){.nd.cur .dot,.go,.qc.in,.qc.good,.qc.shake,.chk{animation:none}.card,.opts label{transition:none}}
</style>
</head>
<body>
<main id="app"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/13.2.0/math.min.js"></script>
<script src="js/generadores.js"></script>
<script src="js/motor.js"></script>
<script src="js/app.js"></script>
</body>
</html>
